version: "2"

run:
  concurrency: 8
  modules-download-mode: readonly

linters:
  default: all
  disable:
    - contextcheck
    - depguard
    - embeddedstructfieldcheck
    - err113
    - exhaustruct
    - funcorder
    - gochecknoglobals
    - gochecknoinits
    - godox
    - inamedparam
    - ireturn
    - mnd
    - musttag
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - paralleltest
    - promlinter # maybe?
    - protogetter
    - recvcheck
    - revive
    - tagalign
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck # maybe?
    - wsl
    - wsl_v5
  settings:
    cyclop:
      max-complexity: 20
      package-average: 0
    dupl:
      threshold: 150
    errcheck:
      check-type-assertions: true
    funlen:
      lines: 80
      statements: 40
    gocritic:
      disabled-checks:
        - commentFormatting
    govet:
      disable:
        - fieldalignment
      enable-all: true
      settings:
        shadow:
          strict: false
    lll:
      line-length: 160
      tab-width: 1
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation:
        - funlen
        - lll
    staticcheck:
      checks:
        - '*'
      initialisms: ["GRPC", "TTL", "ACL", "API", "ASCII", "CPU", "CSS", "DNS", "EOF", "GUID", "HTML", "HTTP", "HTTPS", "IP", "JSON", "QPS", "RAM", "RPC", "SLA", "SMTP", "SQL", "SSH", "TCP", "TLS", "TTL", "UDP", "UI", "GID", "UID", "UUID", "URI", "URL", "UTF8", "VM", "XML", "XMPP", "XSRF", "XSS", "SIP", "RTP", "AMQP", "DB"]
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
        text: 'G115: integer overflow conversion'
      - linters:
          - govet
        text: 'shadow: declaration of "ctx" shadows declaration'
      - linters:
          - cyclop
          - dupl
          - unused
          - prealloc
          - funlen
          - lll
        path: (.+)_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 30
  max-same-issues: 20

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - prefix(golang.org)
        - prefix(github.com)
        - default
        - prefix(github.com/mikhailv)
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
