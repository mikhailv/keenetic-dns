addr: '0.0.0.0:5333'
http_addr: '' # if empty the same value as `addr` will be used

logging:
  debug: false
  history_size: 2000

agent:
  base_url: 'http://127.0.0.1:5332/'
  timeout: 10s

dns:
  ttl_override: 60s
  drop_ech: false
  drop_aaaa: false
  query_history_size: 2000
  providers: {}

mdns:
  enabled: false
  services: []

storage:
  local:
    file: dns_store.dat
    save_interval: 10m

routing:
  table: 1001
  rules: []
  reconcile:
    interval: 2m
    timeout: 20s
  route_timeout: 30m
  hosts: []
  static: []

conntrack:
  poll_interval: 5s
  bucket_interval: 1m
  chunk_interval: 1h
  cache_duration: 3h
  save_interval: 10m
  data_dir: conntrack
  history_size: 1000

blocking:
  # `lists` and `groups` are picked up while running, the settings around them only on restart
  enabled: false
  mode: nxdomain # nxdomain | null | nodata
  data_dir: blocklist
  refresh_interval: 24h
  download_timeout: 2m
  lists: []
    # `urls` are sources of blocked domains and `allow_urls` sources of allowed domains.
    # `allow` and `deny` are lists of domains that can be written in config.
    #
    # - name: hagezi-pro
    #   enabled: true
    #   urls:
    #     - 'https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/wildcard/pro-onlydomains.txt'
    #   allow_urls: []
    #   allow: ['analytics.mycompany.com']
    #   deny: ['annoying.example.net']

  groups: []
  # groups:
  #   - name: kids
  #     clients: ['192.168.1.50', '192.168.9.0/24']
  #     lists: [hagezi-pro, my-overrides]

  stats:
    enabled: false
    data_dir: blockstats
    chunk_duration: 1h
    flush_interval: 5m
    max_entries: 50000

query_stats:
  enabled: false
  data_dir: querystats
  chunk_duration: 1h
  flush_interval: 5m
  max_entries: 50000
